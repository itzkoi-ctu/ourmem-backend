# fly.toml app configuration file generated for ourmemory-backend on 2026-08-03T20:07:31+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ourmemory-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORS_ALLOWED_ORIGINS = 'http://koictu.id.vn,https://ourmem.vercel.app'
  SPRING_FLYWAY_ENABLED = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
